<!-- Точка входа и доступная оболочка Telegram Mini App. -->
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f7f9">
    <meta name="description" content="Фэшн стор — стильная женская одежда на каждый день">
    <title>Фэшн стор</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="app" class="app-shell">
      <main id="screen" class="screen" aria-live="polite">
        <section class="loading-screen" aria-label="Загружаем каталог">
          <div class="brand-mark" aria-hidden="true">Ф</div>
          <p class="eyebrow">Фэшн стор</p>
          <h1>Загружаем каталог…</h1>
          <div class="skeleton-grid" aria-hidden="true">
            <span class="skeleton-card"></span>
            <span class="skeleton-card"></span>
          </div>
        </section>
      </main>

      <nav id="bottom-nav" class="bottom-nav" aria-label="Основная навигация" hidden>
        <button class="nav-button" type="button" data-action="navigate" data-screen="home" aria-label="Главная">
          <span class="nav-icon" aria-hidden="true">⌂</span><span>Главная</span>
        </button>
        <button class="nav-button" type="button" data-action="navigate" data-screen="catalog" aria-label="Каталог">
          <span class="nav-icon" aria-hidden="true">▦</span><span>Каталог</span>
        </button>
        <button class="nav-button" type="button" data-action="navigate" data-screen="cart" aria-label="Корзина">
          <span class="nav-icon nav-icon--badge" aria-hidden="true">⌑<b id="cart-badge" class="nav-badge" hidden>0</b></span><span>Корзина</span>
        </button>
        <button class="nav-button" type="button" data-action="navigate" data-screen="orders" aria-label="Заказы">
          <span class="nav-icon" aria-hidden="true">✓</span><span>Заказы</span>
        </button>
        <button class="nav-button" type="button" data-action="navigate" data-screen="store" aria-label="Магазин">
          <span class="nav-icon" aria-hidden="true">●</span><span>Магазин</span>
        </button>
      </nav>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="data.js"></script>
    <script src="core.js"></script>
    <script src="app.js"></script>
  </body>
</html>
