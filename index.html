<!-- Точка входа и доступная оболочка каталога для браузера и Telegram Mini App. -->
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f7f4ef">
    <meta name="description" content="🛍 Выгодные покупки — женская одежда по приятным ценам с доставкой до Элисты">
    <title>🛍 Выгодные покупки</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20261008-screen-always-visible-1">
  </head>
  <body>
    <div id="app" class="app-shell">
      <main id="screen" class="screen" aria-live="polite">
        <section class="loading-screen" aria-label="Загружаем каталог">
          <div class="brand-mark" aria-hidden="true">🛍</div>
          <p class="eyebrow">🛍 Выгодные покупки</p>
          <h1>Загружаем каталог…</h1>
          <div class="skeleton-grid" aria-hidden="true">
            <span class="skeleton-card"></span>
            <span class="skeleton-card"></span>
          </div>
        </section>
      </main>

      <nav id="bottom-nav" class="bottom-nav" aria-label="Основная навигация" hidden>
        <button class="nav-button" type="button" data-action="navigate" data-screen="home" aria-label="Главная">
          <span class="nav-icon" data-icon="home" aria-hidden="true"></span><span>Главная</span>
        </button>
        <button class="nav-button" type="button" data-action="navigate" data-screen="catalog" aria-label="Каталог">
          <span class="nav-icon" data-icon="grid" aria-hidden="true"></span><span>Каталог</span>
        </button>
        <button class="nav-button" type="button" data-action="navigate" data-screen="cart" aria-label="Корзина">
          <span class="nav-icon nav-icon--badge" aria-hidden="true"><span data-icon="bag"></span><b id="cart-badge" class="nav-badge" hidden>0</b></span><span>Корзина</span>
        </button>
        <button class="nav-button" type="button" data-action="navigate" data-screen="orders" aria-label="Заказы">
          <span class="nav-icon" data-icon="receipt" aria-hidden="true"></span><span>Заказы</span>
        </button>
      </nav>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>

    <script data-startup-guard>
      (function createStartupGuard(windowLike, documentLike) {
        'use strict';

        const releaseId = '20261008-unified-startup-guard-1';
        let hasStartupFailure = false;

        function resourceName(resource) {
          return String(resource || 'неизвестный файл')
            .split(/[?#]/, 1)[0]
            .split('/')
            .pop()
            .replace(/[^a-zA-Z0-9._-]/g, '') || 'неизвестный файл';
        }

        function fail(resource) {
          hasStartupFailure = true;
          const screen = documentLike.querySelector('#screen');
          if (!screen) return;

          const failedResource = resourceName(resource);
          screen.innerHTML = `
            <section class="loading-screen" role="alert" aria-live="assertive">
              <div class="brand-mark" aria-hidden="true">🛍</div>
              <p class="eyebrow">🛍 Выгодные покупки</p>
              <h1>Не удалось запустить приложение</h1>
              <p>Не загрузился обязательный файл: <strong>${failedResource}</strong>.</p>
              <p>Версия запуска: <strong>${releaseId}</strong>.</p>
              <button class="primary-button" type="button" data-startup-retry>Повторить</button>
            </section>
          `;
        }

        documentLike.addEventListener('click', (event) => {
          if (event.target.closest?.('[data-startup-retry]')) windowLike.location.reload();
        });
        documentLike.addEventListener('error', (event) => {
          const target = event.target;
          if (target?.tagName === 'SCRIPT' && target.dataset?.startupModule !== undefined) {
            fail(target.src);
          }
        }, true);

        windowLike.FashionStoreStartup = {
          fail,
          hasFailed: () => hasStartupFailure,
        };
      })(window, document);
    </script>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script data-mobile-startup-visibility>
      (function markMobileTelegram(documentLike, windowLike) {
        'use strict';

        const platform = String(windowLike.Telegram?.WebApp?.platform || '').toLowerCase();
        if (platform === 'ios' || platform === 'android') {
          documentLike.documentElement.dataset.mobileTelegram = 'true';
        }
      })(document, window);
    </script>
    <script src="platform.js?v=20261003-mobile-save-correlation-1" data-startup-module></script>
    <script src="data.js?v=20261004-data-syntax-recovery-1" data-startup-module></script>
    <script src="core.js?v=20261004-mobile-webview-compat-1" data-startup-module></script>
    <script src="ui.js" data-startup-module></script>
    <script src="admin-draft-store.js?v=20260904-admin-save-1" data-startup-module></script>
    <script src="api.js?v=20261004-mobile-webview-compat-1" data-startup-module></script>
    <script src="app.js?v=20261008-unified-startup-guard-1" data-startup-module></script>
  </body>
</html>
